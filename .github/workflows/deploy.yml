name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure login (required for az CLI)
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SEEQLCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SEEQLCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SEEQLCONTAINER_AZURE_SUBSCRIPTION_ID }}

      # Enable buildx (multi-arch builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Build and push image to Docker Hub
      - name: Build and Push Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t sahil796/seeql-container:${{ github.sha }} \
            -t sahil796/seeql-container:latest \
            --push .

      # Deploy updated image to Azure Container App
      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name seeql-container \
            --resource-group seeql-rg \
            --image docker.io/sahil796/seeql-container:${{ github.sha }}