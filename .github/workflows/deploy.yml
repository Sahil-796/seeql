name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SEEQLCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SEEQLCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SEEQLCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR credentials
        run: |
          ACR_USERNAME=$(az acr credential show --name seeqlregistry --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name seeqlregistry --query "passwords[0].value" -o tsv)
          echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV

      - name: Build and push image to ACR
        run: |
          docker login seeqlregistry.azurecr.io -u $ACR_USERNAME -p $ACR_PASSWORD
          docker build -t seeqlregistry.azurecr.io/seeql:${{ github.sha }} -t seeqlregistry.azurecr.io/seeql:latest .
          docker push seeqlregistry.azurecr.io/seeql:${{ github.sha }}
          docker push seeqlregistry.azurecr.io/seeql:latest

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name seeql-container \
            --resource-group seeql-rg \
            --image seeqlregistry.azurecr.io/seeql:${{ github.sha }}
